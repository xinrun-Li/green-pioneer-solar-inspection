<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenDesign Preview</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Avenir Next", "PingFang SC", sans-serif;
        background: #f4f5f2;
        color: #17201b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
      }

      main {
        width: min(1120px, calc(100% - 48px));
        margin: 0 auto;
        padding: 64px 0 80px;
      }

      header {
        display: grid;
        gap: 10px;
        margin-bottom: 40px;
      }

      .eyebrow {
        margin: 0;
        color: #587164;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 5vw, 62px);
        letter-spacing: -0.04em;
        line-height: 1;
      }

      .intro {
        max-width: 620px;
        margin: 4px 0 0;
        color: #66706a;
        font-size: 16px;
        line-height: 1.7;
      }

      #content {
        display: grid;
        gap: 36px;
      }

      section {
        display: grid;
        gap: 16px;
      }

      h2 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.015em;
      }

      .group {
        display: grid;
        gap: 12px;
      }

      .group-title {
        margin: 0;
        color: #78817c;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 12px;
      }

      a {
        display: flex;
        min-height: 92px;
        align-items: flex-end;
        justify-content: space-between;
        padding: 20px;
        border: 1px solid #dfe3de;
        background: #fff;
        color: inherit;
        text-decoration: none;
        transition: border-color 160ms ease, transform 160ms ease;
      }

      a::after {
        content: "↗";
        color: #1f7650;
        font-size: 18px;
      }

      a:hover {
        border-color: #91a99b;
        transform: translateY(-2px);
      }

      .empty,
      .error {
        padding: 22px;
        border: 1px dashed #cbd1cc;
        color: #69736d;
        line-height: 1.6;
      }

      .error {
        border-color: #d9b9b4;
        color: #8a3e35;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">OpenDesign Workspace</p>
        <h1>设计预览</h1>
        <p class="intro">此页面读取当前项目的设计清单，并集中展示原型与设计系统文件。</p>
      </header>
      <div id="content" aria-live="polite">
        <div class="empty">正在读取设计清单…</div>
      </div>
    </main>

    <script>
      const content = document.querySelector("#content");

      function renderManifest(manifest) {
        const sections = (manifest.sections || []).filter((section) =>
          (section.groups || []).some((group) => (group.files || []).length),
        );

        if (!sections.length) {
          content.innerHTML = '<div class="empty">尚未生成可预览的设计文件。</div>';
          return;
        }

        content.replaceChildren(
          ...sections.map((section) => {
            const sectionElement = document.createElement("section");
            const heading = document.createElement("h2");
            heading.textContent = section.label || section.id;
            sectionElement.append(heading);

            for (const group of section.groups || []) {
              if (!(group.files || []).length) continue;
              const groupElement = document.createElement("div");
              groupElement.className = "group";

              const groupTitle = document.createElement("p");
              groupTitle.className = "group-title";
              groupTitle.textContent = group.slug;

              const grid = document.createElement("div");
              grid.className = "grid";
              for (const file of group.files) {
                const link = document.createElement("a");
                link.href = file.path;
                link.textContent = file.label;
                grid.append(link);
              }

              groupElement.append(groupTitle, grid);
              sectionElement.append(groupElement);
            }

            return sectionElement;
          }),
        );
      }

      fetch("./manifest.json", { cache: "no-store" })
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then(renderManifest)
        .catch(() => {
          content.innerHTML =
            '<div class="error">暂未找到 manifest.json。完成原型生成后，预览入口会自动显示全部文件。</div>';
        });
    </script>
  </body>
</html>
