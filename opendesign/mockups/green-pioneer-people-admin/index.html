drawer-body{padding:15px}.field-list{display:grid;gap:0}.field-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.field-row span{color:var(--muted);font-size:9px}.field-row strong{font-size:9px;text-align:right}.drawer-section{margin:19px 0 8px;color:var(--muted);font:8px var(--mono);letter-spacing:.12em}.drawer-buttons{display:grid;gap:7px;margin-top:18px}.drawer-buttons button{min-height:34px;border-radius:5px;font-size:9px}.drawer-buttons .approve{color:#fff;background:var(--brand-dark);border:1px solid var(--brand-dark)}.drawer-buttons .reject{color:var(--danger);background:transparent;border:1px solid var(--danger)}.drawer-buttons .quiet{color:var(--muted)}.audit-log{display:grid;gap:0}.audit-row{display:grid;grid-template-columns:90px 1fr 100px 80px;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:9px}.audit-row.head{background:var(--soft);color:var(--muted);font:8px var(--mono)}.audit-row strong{font-size:10px}.audit-row small{display:block;margin-top:4px;color:var(--muted);font-size:8px}.timeline{display:grid;gap:12px}.timeline-item{display:grid;grid-template-columns:18px 1fr;gap:8px}.timeline-dot{width:18px;height:18px;display:grid;place-items:center;color:var(--brand);border:1px solid var(--brand);border-radius:50%;font:7px var(--mono)}.timeline-item strong{display:block;font-size:9px}.timeline-item small{display:block;margin-top:4px;color:var(--muted);font-size:8px;line-height:1.5}
    .dense .data-table td{padding-top:7px;padding-bottom:7px}.dense .data-table th{padding-top:7px;padding-bottom:7px}.dense .person-cell small{display:none}.cards-mode .data-table{display:none}.cards-mode .card-grid{display:grid!important}.card-grid{display:none;grid-template-columns:repeat(3,1fr);gap:9px;padding:12px}.person-card{padding:12px;border:1px solid var(--line);border-radius:7px;background:var(--surface-soft)}.person-card strong{display:block;font-size:11px}.person-card small{display:block;margin-top:5px;color:var(--muted);font-size:9px}.person-card .card-actions{display:flex;gap:7px;margin-top:12px}.person-card button{border:0;background:transparent;color:var(--brand);font-size:9px}.toast{position:fixed;right:23px;bottom:20px;padding:10px 13px;background:var(--surface);border:1px solid var(--brand);border-radius:6px;box-shadow:var(--shadow);font-size:9px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}

<body data-theme="fresh">
  <div class="app">
    <div class="top-switch"><div class="brand-line"><span class="kicker">OPENDESIGN / CONTROL OPERATORS</span><strong>绿能先锋 · 控制人员管理后台</strong></div><div class="theme-tabs"><button class="theme-tab active" data-theme="fresh">浅色巡检台</button><button class="theme-tab" data-theme="dark">深色工业台</button><button class="theme-tab" data-theme="neutral">中性企业台</button></div></div>
    <div class="shell"><aside class="sidebar"><div class="mark"><span class="mark-icon">GP</span><div class="mark-copy"><strong>绿能先锋</strong><span>INSPECTION CONSOLE</span></div></div><div class="scope"><small>管理范围</small><strong>北区 · 控制人员</strong><span>权限服务运行中</span></div><p class="nav-title">人员中心</p><nav class="nav"><button class="active" data-page="home"><b>01</b><span>管理首页</span><small>02</small></button><button data-page="review"><b>02</b><span>注册审核</span><small>03</small></button><button data-page="people"><b>03</b><span>控制人员</span><small>04</small></button><button data-page="audit"><b>04</b><span>操作日志</span><small>—</small></button></nav><p class="nav-title" style="margin-top:22px">快捷操作</p><nav class="nav"><button data-toast="已打开新增控制人员表单"><b>＋</b><span>新增控制人员</span><small>→</small></button><button data-page="review"><b>!</b><span>查看待审核</span><small>03</small></button></nav><div class="side-foot"><span class="online"></span>账号服务 · 运行中<br><span style="margin-left:12px">superuser: admin</span></div></aside><main><header class="header"><div><small>绿能先锋 / 人员中心</small><strong id="title">管理首页</strong></div><div class="head-actions"><input class="search" id="global-search" placeholder="搜索姓名、用户名或手机号" /><button class="head-button" data-toast="通知中心已打开">通知 <span style="color:var(--warn)">03</span></button><span class="avatar">管</span></div></header><section class="content" id="content"></section></main></div>
  </div><div class="toast" id="toast">操作已记录</div>
  <script>
    const roles={admin:'管理员',reviewer:'审核员',inspector:'巡检员',viewer:'查看员'};
    const people=[['陈明','chenming','138****1208','巡检员','待审核','今天 09:18'],['李雪','lixue','139****8831','巡检员','待审核','今天 08:52'],['王强','wangqiang','136****4412','巡检员','待审核','昨天 17:46'],['赵宁','zhaoning','137****3098','审核员','正常','08/08 16:20'],['周航','zhouhang','135****7620','巡检员','正常','08/08 11:04'],['林悦','linyue','186****5201','查看员','已停用','08/06 14:38']];
    const notes={home:'<strong>控制台首页：</strong>把待审核注册、人员状态和风险操作放在管理人员第一视线。',review:'<strong>注册审核：</strong>默认申请角色为巡检员，审核通过时由管理员改分配四类业务角色。',people:'<strong>控制人员：</strong>提供增删改查、批量审核、批量停用和密码重置，用户名保持不可修改。',audit:'<strong>操作日志：</strong>审核、驳回、角色变更、停用和删除均留下操作者、时间与原因。'};
    const titles={home:'管理首页',review:'注册审核',people:'控制人员',audit:'操作日志'};
    function head(page,actions=''){return `<div class="page-head"><div><span class="eyebrow">GREEN PIONEER / ${page.toUpperCase()}</span><h1>${titles[page]}</h1><p id="page-note">${notes[page]}</p></div><div class="actions">${actions}</div></div>`}
    function home(){return head('home','<button class="quiet" data-page="audit">查看日志</button><button class="primary" data-page="review">处理待审核</button>')+`<div class="notice"><span>REVIEW / 03</span><p>有 3 位前台注册用户等待审核，默认申请角色为巡检员。</p><button data-page="review">进入审核 →</button></div><div class="stats"><article class="stat warn"><small>待审核</small><strong>03</strong><span>最早申请 17 小时前</span></article><article class="stat"><small>正常账号</small><strong>03</strong><span>管理员 01 · 审核员 01 · 巡检员 01</span></article><article class="stat danger"><small>已停用</small><strong>01</strong><span>可由管理员恢复</span></article><article class="stat info"><small>本月新增</small><strong>08</strong><span>较上月 +2</span></article></div><div class="grid"><article class="card"><div class="card-head"><h2>待审核队列</h2><span>按注册时间倒序</span></div><div class="card-body"><table class="queue-table"><thead><tr><th>申请人</th><th>手机号</th><th>申请角色</th><th>注册时间</th><th>操作</th></tr></thead><tbody>${people.slice(0,3).map(p=>`<tr><td><strong>${p[0]}</strong><br><span style="color:var(--muted);font-size:8px">${p[1]}</span></td><td>${p[2]}</td><td><span class="pill warn">${p[3]}</span></td><td>${p[5]}</td><td><button class="queue-action" data-page="review">审核 →</button></td></tr>`).join('')}</tbody></table></div></article><article class="card"><div class="card-head"><h2>角色分布</h2><span>已通过账号</span></div><div class="card-body"><div class="role-chart"><div class="role-row"><span>管理员</span><div class="role-bar"><i style="width:34%"></i></div><b>01</b></div><div class="role-row"><span>审核员</span><div class="role-bar"><i style="width:34%"></i></div><b>01</b></div><div class="role-row"><span>巡检员</span><div class="role-bar"><i style="width:34%"></i></div><b>01</b></div><div class="role-row"><span>查看员</span><div class="role-bar"><i style="width:0%"></i></div><b>00</b></div></div></div></article></div><article class="card" style="margin-top:12px"><div class="card-head"><h2>最近操作</h2><button class="queue-action" data-page="audit">查看全部 →</button></div><div class="card-body"><div class="activity"><div class="activity-item"><strong>admin 审核了控制人员申请</strong><small>赵宁 · 分配角色：审核员</small><span class="activity-time">今天 09:16 / APPROVE</span></div><div class="activity-item"><strong>admin 重置了周航的密码</strong><small>未强制账号下线</small><span class="activity-time">昨天 18:03 / RESET</span></div><div class="activity-item"><strong>admin 停用了控制人员账号</strong><small>林悦 · 原因：长期未使用</small><span class="activity-time">08/06 14:38 / DISABLE</span></div></div></div></article>`}
    function review(){return head('review','<button class="quiet" data-toast="已导出审核列表">导出列表</button><button class="primary" data-action="batchApprove">批量通过</button>')+`<div class="filters"><div class="filter-set"><input id="review-search" placeholder="搜索姓名、用户名、手机号" /><select><option>全部状态</option><option>待审核</option><option>已驳回</option></select><select><option>申请角色：巡检员</option></select></div><div class="density"><span>审核交互</span><button class="mode-tab active" data-mode="drawer">右侧抽屉</button><button class="mode-tab" data-mode="page">详情页面</button><button class="mode-tab" data-mode="modal">快速弹窗</button></div></div><div class="review-grid"><article class="card"><div class="card-head"><h2>注册申请 <span class="pill warn" style="margin-left:6px">03 待处理</span></h2><span>待审核优先 · 注册时间倒序</span></div><table class="data-table"><thead><tr><th class="select-col"><input class="check" type="checkbox" /></th><th>申请人</th><th>手机号</th><th>申请角色</th><th>注册时间</th><th>状态</th><th>操作</th></tr></thead><tbody id="review-rows">${people.slice(0,3).map((p,i)=>`<tr class="${i===0?'selected':''}" data-row="${i}" data-search="${p[0]} ${p[1]} ${p[2]}"><td><input class="check" type="checkbox" /></td><td class="person-cell"><strong>${p[0]}</strong><small>${p[1]}</small></td><td>${p[2]}</td><td><span class="pill warn">${p[3]}</span></td><td>${p[5]}</td><td><span class="pill warn">${p[4]}</span></td><td><div class="table-actions"><button data-review="${i}">审核</button><button data-action="reject">驳回</button></div></td></tr>`).join('')}</tbody></table><div class="card-grid">${people.slice(0,3).map((p,i)=>`<article class="person-card"><strong>${p[0]}</strong><small>${p[1]} · ${p[2]}</small><small>申请角色：${p[3]}<br>注册：${p[5]}</small><div class="card-actions"><button data-review="${i}">审核</button><button data-action="reject">驳回</button></div></article>`).join('')}</div></article><aside class="drawer" id="review-detail"></aside></div>`}
    function detail(i=0){const p=people[i]||people[0];return `<div class="drawer-head"><div><h2>${p[0]} <span class="pill warn" style="margin-left:4px">待审核</span></h2><small>注册申请 · ${p[5]}</small></div><button data-action="close">×</button></div><div class="drawer-body"><div class="drawer-section">申请资料</div><div class="field-list"><div class="field-row"><span>用户名</span><strong>${p[1]}</strong></div><div class="field-row"><span>姓名</span><strong>${p[0]}</strong></div><div class="field-row"><span>手机号</span><strong>${p[2]}</strong></div><div class="field-row"><span>申请角色</span><strong>${p[3]}</strong></div><div class="field-row"><span>注册时间</span><strong>${p[5]}</strong></div></div><div class="drawer-section">审核分配</div><div class="field-row"><span>通过后角色</span><select style="height:27px;padding:0 6px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:4px;font-size:9px"><option>巡检员</option><option>审核员</option><option>管理员</option><option>查看员</option></select></div><div class="drawer-buttons"><button class="approve" data-action="approve">通过并分配角色</button><button class="reject" data-action="reject">驳回并填写原因</button><button class="quiet" data-action="notify">查看用户通知状态</button></div></div>`}
    function peoplePage(){return head('people','<button class="quiet" data-toast="已打开导入模板">导入人员</button><button class="primary" data-toast="已打开新增控制人员表单">新增控制人员</button>')+`<div class="filters"><div class="filter-set"><input id="people-search" placeholder="搜索姓名、用户名、手机号" /><select><option>全部状态</option><option>正常</option><option>已停用</option></select><select><option>全部角色</option><option>管理员</option><option>审核员</option><option>巡检员</option><option>查看员</option></select><button class="quiet" data-toast="筛选条件已保存">保存筛选</button></div><div class="density"><span>信息密度</span><button class="mode-tab active" data-density="normal">标准</button><button class="mode-tab" data-density="dense">紧凑</button><button class="mode-tab" data-density="cards">卡片</button></div></div><article class="card" id="people-card"><div class="card-head"><h2>控制人员 <span class="pill" style="margin-left:6px">06</span></h2><span>用户名不可修改 · 普通管理员只能停用</span></div><table class="data-table"><thead><tr><th><input class="check" type="checkbox" /></th><th>人员</th><th>手机号</th><th>角色</th><th>状态</th><th>注册时间</th><th>操作</th></tr></thead><tbody id="people-rows">${people.map((p,i)=>`<tr data-search="${p[0]} ${p[1]} ${p[2]} ${p[3]} ${p[4]}"><td><input class="check" type="checkbox" /></td><td class="person-cell"><strong>${p[0]}</strong><small>${p[1]}</small></td><td>${p[2]}</td><td><span class="pill ${p[3]==='巡检员'?'warn':''}">${p[3]}</span></td><td><span class="pill ${p[4]==='待审核'?'warn':p[4]==='已停用'?'bad':''}">${p[4]}</span></td><td>${p[5]}</td><td><div class="table-actions"><button data-toast="已打开 ${p[0]} 详情">查看</button><button data-toast="已打开 ${p[0]} 编辑">编辑</button>${p[4]==='已停用'?'<button data-toast="账号已恢复">恢复</button>':'<button class="danger" data-toast="已提交停用确认">停用</button>'}</div></td></tr>`).join('')}</tbody></table><div class="card-grid">${people.map(p=>`<article class="person-card"><strong>${p[0]} <span class="pill" style="float:right">${p[3]}</span></strong><small>${p[1]} · ${p[2]}</small><small>状态：${p[4]}<br>注册：${p[5]}</small><div class="card-actions"><button data-toast="已打开详情">查看</button><button data-toast="已打开编辑">编辑</button><button data-toast="已提交账号操作">操作</button></div></article>`).join('')}</div></article><div class="notice" style="margin-top:12px"><span>SUPERUSER ONLY</span><p>彻底删除账号会保留审计记录，仅 Django superuser 可执行；普通管理员只能停用。</p><button data-toast="删除权限说明已打开">查看权限 →</button></div>`}
    function audit(){return head('audit','<button class="quiet" data-toast="日志已导出">导出日志</button>')+`<div class="filters"><div class="filter-set"><input placeholder="搜索操作者或目标账号" /><select><option>全部操作类型</option><option>审核</option><option>驳回</option><option>角色变更</option><option>停用</option><option>删除</option></select><input type="date" value="2026-08-01" /><input type="date" value="2026-08-09" /></div><div class="density"><span>共 28 条记录</span></div></div><article class="card"><div class="audit-log"><div class="audit-row head"><span>时间</span><span>操作内容</span><span>操作者</span><span>结果</span></div>${[['今天 09:16','审核通过 陈明 · 分配角色：巡检员','admin','成功'],['今天 08:52','驳回 李雪 · 原因：手机号未验证','admin','已通知'],['昨天 18:03','重置 周航 的登录密码','admin','成功'],['08/08 16:20','角色变更 赵宁 · 巡检员 → 审核员','admin','成功'],['08/06 14:38','停用 林悦 · 原因：长期未使用','admin','成功'],['08/05 11:42','创建控制人员 operator-02','superuser','成功']].map((r,i)=>`<div class="audit-row"><span class="mono">${r[0]}</span><div><strong>${r[1]}</strong><small>审计编号 AUD-${1042-i}</small></div><span>${r[2]}</span><span class="pill ${r[3]==='已通知'?'warn':''}">${r[3]}</span></div>`).join('')}</div></article>`}
    const renderers={home,review,people:peoplePage,audit};let current='home';let reviewIndex=0;
    function render(page){current=page;document.querySelector('#content').innerHTML=renderers[page]();document.querySelector('#title').textContent=titles[page];document.querySelectorAll('.nav button[data-page]').forEach(n=>n.classList.toggle('active',n.dataset.page===page));if(page==='review'){document.querySelector('#review-detail').innerHTML=detail(reviewIndex);document.querySelectorAll('[data-mode]').forEach(n=>n.addEventListener('click',()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===n));showToast(({drawer:'已切换为右侧详情抽屉',page:'已切换为独立详情页',modal:'已切换为快速审核弹窗'}[n.dataset.mode]))}))}bind();}
    function showToast(message){const t=document.querySelector('#toast');t.textContent=message;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),1700)}
    function bind(){document.querySelectorAll('[data-page]').forEach(n=>n.addEventListener('click',e=>{e.preventDefault();render(n.dataset.page)}));document.querySelectorAll('[data-toast]').forEach(n=>n.addEventListener('click',e=>{e.preventDefault();showToast(n.dataset.toast)}));document.querySelectorAll('[data-review]').forEach(n=>n.addEventListener('click',()=>{reviewIndex=Number(n.dataset.review);const d=document.querySelector('#review-detail');if(d)d.innerHTML=detail(reviewIndex);bind()}));document.querySelectorAll('[data-action]').forEach(n=>n.addEventListener('click',()=>showToast(({approve:'审核通过，已写入操作日志并通知用户',reject:'请填写驳回原因后发送站内通知',close:'详情抽屉已关闭',notify:'用户当前可在前端查看通知'}[n.dataset.action]||'操作已记录'))));const rs=document.querySelector('#review-search');if(rs)rs.oninput=()=>document.querySelectorAll('#review-rows tr').forEach(n=>n.style.display=!rs.value||n.dataset.search.includes(rs.value)?'':'none');const ps=document.querySelector('#people-search');if(ps)ps.oninput=()=>document.querySelectorAll('#people-rows tr').forEach(n=>n.style.display=!ps.value||n.dataset.search.includes(ps.value)?'':'none');document.querySelectorAll('[data-density]').forEach(n=>n.addEventListener('click',()=>{document.querySelectorAll('[data-density]').forEach(x=>x.classList.toggle('active',x===n));const card=document.querySelector('#people-card');if(!card)return;card.classList.toggle('dense',n.dataset.density==='dense');card.classList.toggle('cards-mode',n.dataset.density==='cards')}));}
    document.querySelectorAll('.theme-tab').forEach(n=>n.addEventListener('click',()=>{document.body.dataset.theme=n.dataset.theme;document.querySelectorAll('.theme-tab').forEach(x=>x.classList.toggle('active',x===n))}));render('home');
  </script>
</body>
</html>
