    function renderPage(page){ currentPage=page; document.querySelector('#page-content').innerHTML=renderers[page](); document.querySelector('#page-title').textContent=pageNames[page]; document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active', b.dataset.page===page)); bindActions(); }
    function toast(message){ const node=document.querySelector('#toast'); node.textContent=message; node.classList.add('show'); clearTimeout(window.__toast); window.__toast=setTimeout(()=>node.classList.remove('show'),1800); }
    function bindActions(){ document.querySelectorAll('[data-page]').forEach(node=>node.addEventListener('click',()=>renderPage(node.dataset.page))); document.querySelectorAll('[data-action]').forEach(node=>node.addEventListener('click',()=>toast(({refresh:'数据已刷新',upload:'已打开本地素材选择器',run:'识别作业已进入队列',confirm:'复核记录已保存',finish:'已生成异常事件',filter:'筛选面板已展开',export:'报告已加入导出队列',create:'创建流程已进入下一步',open:'已打开详情',save:'设置已保存',submit:'样本已提交，等待冻结',freeze:'数据集版本已冻结',activate:'候选模型仍需人工确认',logs:'训练日志接口已预留',audit:'审计日志已打开'}[node.dataset.action]||'操作已记录')))); }
    document.querySelectorAll('.style-tab').forEach(tab=>tab.addEventListener('click',()=>{ document.body.dataset.style=tab.dataset.style; document.querySelectorAll('.style-tab').forEach(x=>x.classList.toggle('active',x===tab)); }));
    renderPage('dashboard');
  </script>
</body>
</html>
